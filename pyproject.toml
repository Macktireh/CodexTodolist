[project]
name = "modern-todolist"
version = "0.4.0"
description = "Une petite application Todolist moderne en Python et Tkinter"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "matplotlib>=3.10",
]

[project.gui-scripts]
todolist = "todolist.app:main"

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "todolist"
